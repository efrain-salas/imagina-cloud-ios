# Parameters of Imagina Cloud for iPhone, read by imagina/apply-branding.py. See IMAGINA.md.
# Machine-specific values and test credentials go in imagina/imagina.local.properties (not in git).

# Nextcloud iOS release the branding starts from: every branded file is rebuilt from this tag.
NEXTCLOUD_IOS_TAG=35.1.0

# Bundle identifier of the app; the extensions are <id>.<extension> and the app groups group.<id>.
IMAGINA_APPLICATION_ID=build.imagina.cloud
# Apple team that signs the app (Imagina's developer account).
IMAGINA_DEVELOPMENT_TEAM=CF798UCN8C
# Name under the icon and in the app's texts.
IMAGINA_APP_NAME=Imagina Cloud
# NSHumanReadableCopyright of the app and of every extension (Nextcloud's own say «Copyright © 2026 Nextcloud»).
IMAGINA_COPYRIGHT=© 2026 Imagina. Basada en Nextcloud.
# URL scheme for the app's own links (widgets, deep links), instead of Nextcloud's «nextcloud».
IMAGINA_URL_SCHEME=imaginacloud

# The cloud the app is fixed to (production). The login of each device comes from Imagina's devices API.
IMAGINA_CLOUD_URL=https://cloud.imagina.build
# Imagina's push server (C7.10, C11.5): it speaks Nextcloud's push proxy protocol and sends with APNs production for the
# topic IMAGINA_APPLICATION_ID, so notifications only reach TestFlight and App Store builds. Empty: no notifications.
IMAGINA_PUSH_SERVER_URL=https://auth.imagina.build/api/push

# Imagina's identity server. Empty: the app uses Nextcloud's own login (Login Flow v2).
IMAGINA_AUTH_HOST=auth.imagina.build
# Public OAuth client of Imagina Cloud in Imagina (the same one as Android; it returns to <id>://oauth2redirect).
IMAGINA_OAUTH_CLIENT_ID=01a11cc3-b700-733c-90c7-e4d0f50f38d8

# Links of the app's settings. The privacy policy (Settings > Information > Privacy and Legal Policy) is the same page the App
# Store listing links to.
IMAGINA_PRIVACY_URL=https://imagina.build/privacy
# Where «Share this app» points (the App Store page once it is published).
IMAGINA_APP_STORE_URL=https://imagina.build
IMAGINA_SOURCE_CODE_URL=https://github.com/efrain-salas/imagina-cloud-ios

# Version of the app in the App Store and build number, for the app and all its extensions. Every upload to App Store Connect
# needs a build number higher than the previous upload of the same version (raise IMAGINA_BUILD_NUMBER before each one; a new
# version number starts again). Nextcloud's own are 35.1.0 and 14; the version can be anything that goes up (1.0.0, 1.1.0...).
IMAGINA_MARKETING_VERSION=35.1.0
IMAGINA_BUILD_NUMBER=14

# Export compliance: the code App Store Connect gives Imagina once its encryption documents are uploaded (App Information, «App
# Encryption Documents»). Leave it out until then: App Store Connect asks the export questions for each build instead.
# IMAGINA_ENCRYPTION_COMPLIANCE_CODE=

# Theme colour (Imagina's accent), as hex; the server's theme can override it.
IMAGINA_ACCENT=#0F766E

# Backgrounds of the screens the brand paints (launch, sign-in, the Files app's error, ...) and the text on them: Imagina's
# canvas (cream) and ink, in the light and the dark theme. Teal (the accent) is only for highlights, never a background.
IMAGINA_CANVAS=#F8F7F4
IMAGINA_CANVAS_DARK=#111219
IMAGINA_INK=#1A1B25
IMAGINA_INK_DARK=#F3F2EE
